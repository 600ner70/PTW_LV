- # ====== Validation: Type Code Must Be Unique ================
  id: 52461709490584414
  identification: 
    name: Type Code Must Be Unique

  execution: 
    sequence: 30

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      DECLARE
          v_count NUMBER;
      BEGIN
          SELECT COUNT(*) INTO v_count
          FROM   ptw_pro.ptw_types
          WHERE  UPPER(ptw_type) = UPPER(:P25_PTW_TYPE)
          AND    (type_id != :P25_TYPE_ID OR :P25_TYPE_ID IS NULL);
          RETURN v_count = 0;
      END;
    always-execute: false

  error: 
    error-message: This Type Code already exists. Please choose a different code.
    display-location: Inline with Field and in Notification
    associated-item: P25_PTW_TYPE # 52460479828584401

  server-side-condition: 
    when-button-pressed: SAVE # 52461089934584407

processes: 
- # ====== Process: Fetch Permit Type ==========================
  id: 52461243254584409
  identification: 
    name: Fetch Permit Type
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      BEGIN
          SELECT t.ptw_type,
                 t.type_desc,
                 t.available,
                 TO_CHAR(t.created_date, 'DD-MON-YYYY') AS created_date,
                 (SELECT COUNT(*) FROM ptw_pro.ptw_lv_company_types ct
                   WHERE ct.type_id = t.type_id AND ct.is_active = 'Y') AS company_count
          INTO   :P25_PTW_TYPE,
                 :P25_TYPE_DESC,
                 :P25_AVAILABLE,
                 :P25_CREATED_DATE,
                 :P25_COMPANY_COUNT
          FROM   ptw_pro.ptw_types t
          WHERE  type_id = :P25_TYPE_ID;
      END;
      

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

  server-side-condition: 
    type: Item is NOT NULL
    item: P25_TYPE_ID

- # ====== Process: Save Permit Type ===========================
  id: 52461356308584410
  identification: 
    name: Save Permit Type
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      IF :P25_TYPE_ID IS NOT NULL THEN
      
          -- Existing type: ptw_type and type_desc are locked - only
          -- available can change.
          UPDATE ptw_pro.ptw_types
          SET    available = :P25_AVAILABLE
          WHERE  type_id = :P25_TYPE_ID;
      
      ELSE
      
          -- New type
          INSERT INTO ptw_pro.ptw_types (ptw_type, type_desc, available)
          VALUES     (:P25_PTW_TYPE, :P25_TYPE_DESC, :P25_AVAILABLE);
      
      END IF;
      

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

