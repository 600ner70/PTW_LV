- # ====== Region: Search Results ==============================
  id: 49754433545978464
  identification: 
    name: Search Results
    type: Cards

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT
          p.permit_id,
          p.permit_number,
          p.site_details,
          p.area_of_works,
          p.work_description,
          p.supervising_company || ' - ' || p.person_in_charge_name AS person_in_charge,
          p.supervising_company,
          p.person_in_charge_name,
          p.workflow_status,
          p.created_by,
          p.auth_person_name,
          p.started_datetime,
          p.ended_datetime,
          p.created_date,
          p.ptw_type,
          '<span class="ptw-badge ' ||
          CASE p.workflow_status
              WHEN 'STARTED'     THEN 'ptw-badge--live'
              WHEN 'COMPLETED'   THEN 'ptw-badge--completed'
              WHEN 'AUTHORISED'  THEN 'ptw-badge--authorised'
              WHEN 'LAPSED'      THEN 'ptw-badge--lapsed'
              WHEN 'SUSPENDED'   THEN 'ptw-badge--suspended'
              WHEN 'CANCELLED'   THEN 'ptw-badge--cancelled'
              WHEN 'IN_PROGRESS' THEN 'ptw-badge--inprogress'
              ELSE 'ptw-badge--lapsed'
          END || '">' ||
          CASE p.workflow_status
              WHEN 'STARTED'     THEN 'Live'
              WHEN 'COMPLETED'   THEN 'Completed'
              WHEN 'AUTHORISED'  THEN 'Authorised'
              WHEN 'LAPSED'      THEN 'Lapsed'
              WHEN 'SUSPENDED'   THEN 'Suspended'
              WHEN 'CANCELLED'   THEN 'Cancelled'
              WHEN 'IN_PROGRESS' THEN 'In Progress'
              ELSE p.workflow_status
          END || '</span>' AS status_badge_html,
          apex_page.get_url(
              p_page   => 300,
              p_items  => 'P300_PERMIT_ID,P300_RETURN_PAGE',
              p_values => p.permit_id || ',50'
          ) AS pdf_url
      FROM ptw_pro.ptw_lv_permits p

  order-by: 
    type: Item
    item: 
      item-name: P50_ORDER_BY
      order-bys: 
      - key: PERMIT_ID
        clause: '"PERMIT_ID" asc'

      - key: PERSON_IN_CHARGE
        clause: '"PERSON_IN_CHARGE" asc'

      - key: WORKFLOW_STATUS
        clause: '"WORKFLOW_STATUS" asc'

      - key: CREATED_DATE
        clause: '"CREATED_DATE" desc'

  layout: 
    sequence: 40
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Cards Container
    template-options: 
    - '#DEFAULT#'
    - t-CardsRegion--hideHeader js-addHiddenHeadingRoleDesc
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    id: 49758489812978507
    appearance: 
      layout: Grid
      grid-columns: Auto

    title: 
      advanced-formatting: true
      html-expression: <a href="&PDF_URL.">&PERMIT_NUMBER.</a>

    subtitle: 
      advanced-formatting: true
      html-expression: '&STATUS_BADGE_HTML!RAW.'

    body: 
      advanced-formatting: true
      html-expression: |
        &PERSON_IN_CHARGE.<br>
        &SITE_DETAILS!RAW.

    secondary-body: 
      advanced-formatting: false

    icon-and-badge: 
      icon-source: No Icon

    media: 
      advanced-formatting: false
      source: No Media

    performance: 
      lazy-loading: false

    pagination: 
      type: Scroll
      show-total-count: false

