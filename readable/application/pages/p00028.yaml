- # ====== Page Item: P28_COMPANY_ID ===========================
  id: 52494935017962708
  identification: 
    name: P28_COMPANY_ID
    type: Select List

  label: 
    label: Active Company
    alignment: Left

  settings: 
    page-action-on-selection: None

  multiple-values: 
    type: No

  layout: 
    sequence: 10
    region: Active Company # 52494859514962707
    slot: BODY
    alignment: Left
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: 6
    label-column-span: Page Template Default

  appearance: 
    template: Optional - Floating
    template-options: 
    - '#DEFAULT#'
    height: 1

  validation: 
    value-required: false

  list-of-values: 
    type: SQL Query
    sql-query: |
      SELECT company_name d,
             company_id   r
      FROM   ptw_pro.ptw_lv_companies
      WHERE  is_active = 'Y'
      ORDER  BY company_name;
    display-extra-values: true
    display-null-value: true
    null-display-value: '-- View All Companies (no restriction) --'

  advanced: 
    warn-on-unsaved-changes: Page Default

  source: 
    type: Expression
    language: PL/SQL
    pl/sql-expression: V('G_OVERRIDE_COMPANY_ID')
    used: Always, replacing any existing value in session state

  session-state: 
    storage: Per Session (Persistent)

  quick-picks: 
    show-quick-picks: false

  security: 
    session-state-protection: Unrestricted
    store-value-encrypted-in-session-state: true
    restricted-characters: All characters can be saved.

- # ====== Page Item: P28_CURRENT_STATUS =======================
  id: 52495028573962709
  identification: 
    name: P28_CURRENT_STATUS
    type: Display Only

  label: 
    label: Currently
    alignment: Left

  settings: 
    format: Plain Text
    based-on: Item Value
    show-line-breaks: true
    send-on-page-submit: true

  layout: 
    sequence: 20
    region: Active Company # 52494859514962707
    slot: BODY
    alignment: Left
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic
    label-column-span: Page Template Default

  appearance: 
    template: Optional - Floating
    template-options: 
    - '#DEFAULT#'

  advanced: 
    warn-on-unsaved-changes: Page Default

  source: 
    type: Function Body
    language: PL/SQL
    pl/sql-function-body: |
      DECLARE
              v_override  VARCHAR2(50)  := V('G_OVERRIDE_COMPANY_ID');
              v_name      VARCHAR2(200);
          BEGIN
              IF v_override IS NULL OR v_override = '' THEN
                  RETURN 'Viewing ALL companies (no restriction).';
              END IF;
      
              BEGIN
                  SELECT company_name
                  INTO   v_name
                  FROM   ptw_pro.ptw_lv_companies
                  WHERE  company_id = TO_NUMBER(v_override);
              EXCEPTION
                  WHEN NO_DATA_FOUND THEN
                      v_name := 'Unknown company (ID: ' || v_override || ')';
              END;
      
              RETURN 'Viewing as: ' || v_name;
          END;
    used: Always, replacing any existing value in session state

  session-state: 
    data-type: VARCHAR2
    storage: Per Session (Persistent)

  security: 
    session-state-protection: Unrestricted
    store-value-encrypted-in-session-state: true
    restricted-characters: All characters can be saved.

