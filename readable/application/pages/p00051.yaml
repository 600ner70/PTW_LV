      show: false

    series: 
    - # ====== Series: Total Permits ===============================
      id: 50563859619122721
      identification: 
        name: Total Permits

      execution: 
        sequence: 10

      source: 
        location: Local Database
        type: SQL Query
        sql-query: |
          SELECT
              CASE :P51_TIME_GROUPING
                  WHEN 'DAILY'  THEN TO_CHAR(group_daily,   'DD-Mon-YYYY')
                  WHEN 'WEEKLY' THEN 'Wk ' || TO_CHAR(group_weekly, 'IW YYYY')
                  ELSE               TO_CHAR(group_monthly,  'Mon-YYYY')
              END              AS period_label,
              CASE :P51_TIME_GROUPING
                  WHEN 'DAILY'  THEN group_daily
                  WHEN 'WEEKLY' THEN group_weekly
                  ELSE               group_monthly
              END              AS period_date,
              COUNT(*)         AS permit_count
          FROM ptw_pro.ptw_lv_analytics_v
          GROUP BY
              CASE :P51_TIME_GROUPING
                  WHEN 'DAILY'  THEN group_daily
                  WHEN 'WEEKLY' THEN group_weekly
                  ELSE               group_monthly
              END,
              CASE :P51_TIME_GROUPING
                  WHEN 'DAILY'  THEN TO_CHAR(group_daily,   'DD-Mon-YYYY')
                  WHEN 'WEEKLY' THEN 'Wk ' || TO_CHAR(group_weekly, 'IW YYYY')
                  ELSE               TO_CHAR(group_monthly,  'Mon-YYYY')
              END
          ORDER BY
              CASE :P51_TIME_GROUPING
                  WHEN 'DAILY'  THEN group_daily
                  WHEN 'WEEKLY' THEN group_weekly
                  ELSE               group_monthly
              END
        page-items-to-submit: 
        - P51_TIME_GROUPING
        - ' P51_WORKFLOW_STATUS'
        - P51_COMPANY
        - ' P51_SITE_DETAILS'
        - P51_PERSON_IN_CHARGE
        - ' P51_CREATED_DATE'
        - ' P51_SEARCH'

      order-by: 
        type: None

      column-mapping: 
        label: PERIOD_LABEL
        value: PERMIT_COUNT

      appearance: 
        color: '#4a9fd4'
        assigned-to-y2-axis: false

      line: 
        style: Solid
        type: Automatic

      marker: 
        show: Automatic
        shape: Automatic

      label: 
        show: false

    axes: 
    - # ====== Axis: x =============================================
      id: 50563952723122722
      identification: 
        name: x
        show-axis: true

      value: 
        format-scaling: Automatic
        baseline-scaling: Zero
        scale: Linear

      major-ticks: 
        show: Yes

      minor-ticks: 
        show: false

      tick-label: 
        show: true
        rotation: true
        position: Outside

    - # ====== Axis: y =============================================
      id: 50564054709122723
      identification: 
        name: y
        show-axis: true

      value: 
        format: Decimal
        decimal-places: 0
        format-scaling: None
        baseline-scaling: Zero
        scale: Linear

      appearance: 
        position: Automatic

      major-ticks: 
        show: Yes

      minor-ticks: 
        show: false

      tick-label: 
        show: true

