- # ====== Process: Add Selected Permit Types ==================
  id: 52463784902584434
  identification: 
    name: Add Selected Permit Types
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      DECLARE
          v_company_id NUMBER;
      BEGIN
          SELECT company_id
          INTO   v_company_id
          FROM   ptw_pro.ptw_lv_users
          WHERE  UPPER(username) = UPPER(SYS_CONTEXT('APEX$SESSION', 'APP_USER'));
       
          FOR i IN 1 .. apex_application.g_f01.count LOOP
              INSERT INTO ptw_pro.ptw_lv_company_types (company_id, type_id, is_active)
              VALUES (v_company_id, apex_application.g_f01(i), 'Y');
          END LOOP;
      END;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: SAVE # 52463555906584432

