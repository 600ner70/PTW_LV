- # ====== Validation: No Self-Authorisation ===================
  id: 33352170367951435
  identification: 
    name: No Self-Authorisation

  execution: 
    sequence: 27

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      BEGIN
        DECLARE
          l_name VARCHAR2(200);
        BEGIN
          BEGIN
            SELECT first_name || ' ' || last_name
            INTO   l_name
            FROM   ptw_pro.ptw_lv_user_roles_v
            WHERE  username = :P5_AUTH_PERSON_SELECT;
          EXCEPTION
            WHEN OTHERS THEN l_name := NULL; 
          END;
          RETURN NOT (
              l_name  IS NOT NULL AND
              l_name IS NOT NULL AND
              UPPER(TRIM(l_name)) = UPPER(TRIM(:P5_ACCEPT_PERSON_NAME))
          );
        END;
      EXCEPTION
          WHEN OTHERS THEN RETURN TRUE;
      END;
    always-execute: false

  error: 
    error-message: The Authorised Person and Person in Charge of Works cannot be the same individual. A permit must not be self-authorised.
    display-location: Inline with Field and in Notification

  server-side-condition: 
    when-button-pressed: AUTHORISE # 39966392216997139

