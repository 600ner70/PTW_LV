processes: 
- # ====== Process: Load Authorisation and Acceptance Data =====
  id: 27356851819033439
  identification: 
    name: Load Authorisation and Acceptance Data
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      BEGIN
          :P5_CURRENT_STEP := 'AUTHORISATION';
          SELECT
              permit_number,
              auth_person_name,
              auth_person_mobile,
              auth_latitude,
              auth_longitude,
              TO_CHAR(auth_datetime, 'DD-MON-YYYY HH24:MI'),
              accept_person_name,
              accept_person_mobile,
              accept_company,
              TO_CHAR(accept_datetime, 'DD-MON-YYYY HH24:MI'),
              accept_latitude,
              accept_longitude,
              workflow_status
          INTO
              :P5_PERMIT_NUMBER,
              :P5_AUTH_PERSON_SELECT,
              :P5_AUTH_PERSON_MOBILE,
              :P5_AUTH_LATITUDE,
              :P5_AUTH_LONGITUDE,
              :P5_AUTH_DATETIME,
              :P5_ACCEPT_PERSON_NAME,
              :P5_ACCEPT_PERSON_MOBILE,
              :P5_ACCEPT_COMPANY,
              :P5_ACCEPT_DATETIME,
              :P5_ACCEPT_LATITUDE,
              :P5_ACCEPT_LONGITUDE,
              :P5_WORKFLOW_STATUS
          FROM ptw_pro.ptw_lv_permits
          WHERE permit_id = :P5_PERMIT_ID;
      
          IF :P5_ACCEPT_DATETIME IS NULL THEN
              :P5_ACCEPT_DATETIME := TO_CHAR(SYSDATE, 'DD-MON-YYYY HH24:MI');
          END IF;
          IF :P5_AUTH_DATETIME IS NULL THEN
              :P5_AUTH_DATETIME := TO_CHAR(SYSDATE, 'DD-MON-YYYY HH24:MI');
          END IF;
      
      EXCEPTION
          WHEN NO_DATA_FOUND THEN
              :P5_ACCEPT_DATETIME := TO_CHAR(SYSDATE, 'DD-MON-YYYY HH24:MI');
              :P5_AUTH_DATETIME := TO_CHAR(SYSDATE, 'DD-MON-YYYY HH24:MI');
              :P5_WORKFLOW_STATUS := 'IN_PROGRESS';
      END;
      
      IF :P5_ACCEPT_COMPANY IS NULL AND :P5_ACCEPT_PERSON_NAME IS NULL THEN
          --
          BEGIN
            SELECT person_in_charge_name, supervising_company
            INTO   :P5_ACCEPT_PERSON_NAME, :P5_ACCEPT_COMPANY
            FROM   ptw_pro.ptw_lv_permits
            WHERE  permit_id = :P5_PERMIT_ID;
          EXCEPTION
            WHEN OTHERS THEN
              NULL;
          END;
      END IF;
      BEGIN
        SELECT 'data:image/png;base64,' || apex_web_service.blob2clobbase64(auth_person_signature),
             'data:image/png;base64,' || apex_web_service.blob2clobbase64(accept_person_signature)
        INTO   :P5_AUTH_SIGNATURE_DATA,
             :P5_ACCEPT_SIGNATURE_DATA
        FROM   ptw_pro.ptw_lv_permits
        WHERE  permit_id = :P5_PERMIT_ID
        AND    (auth_person_signature IS NOT NULL OR accept_person_signature IS NOT NULL);
      EXCEPTION
        WHEN OTHERS THEN
          NULL;
      END;
      
      
      
      
      
      
      

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

- # ====== Process: Save Authorisation and Acceptance Data =====
  id: 27356922514033440
  identification: 
    name: Save Authorisation and Acceptance Data
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      DECLARE
          v_auth_sig_blob BLOB;
          v_accept_sig_blob BLOB;
      
          FUNCTION base64_to_blob(p_base64 CLOB) RETURN BLOB IS
              v_blob BLOB;
              v_clob CLOB;
          BEGIN
              IF p_base64 IS NULL THEN
                  RETURN NULL;
              END IF;
              v_clob := REGEXP_REPLACE(p_base64, '^data:image/[^;]+;base64,', '');
              v_blob := apex_web_service.clobbase642blob(v_clob);
              RETURN v_blob;
          END base64_to_blob;
      
      BEGIN
      
          v_auth_sig_blob := base64_to_blob(:P5_AUTH_SIGNATURE_DATA);
          v_accept_sig_blob := base64_to_blob(:P5_ACCEPT_SIGNATURE_DATA);
      
            UPDATE ptw_pro.ptw_lv_permits
            SET auth_person_name   = UPPER(:P5_AUTH_PERSON_SELECT),
          --   SET auth_person_name   = (SELECT first_name || ' ' || last_name
          --                             FROM   ptw_pro.ptw_lv_users
          --                             WHERE  UPPER(username) = UPPER(:P5_AUTH_PERSON_SELECT)),
                auth_person_signature = v_auth_sig_blob,
                auth_person_mobile = (SELECT mobile_no
                                      FROM   ptw_pro.ptw_lv_users
                                      WHERE  UPPER(username) = UPPER(:P5_AUTH_PERSON_SELECT)),
                auth_datetime = TO_DATE(:P5_AUTH_DATETIME, 'DD-MON-YYYY HH24:MI'),
                auth_latitude = :APP_LATITUDE,
                auth_longitude = :APP_LONGITUDE,
                accept_person_name = :P5_ACCEPT_PERSON_NAME,
                accept_person_signature = v_accept_sig_blob,
                accept_person_mobile = :P5_ACCEPT_PERSON_MOBILE,
                accept_company = :P5_ACCEPT_COMPANY,
                accept_datetime = TO_DATE(:P5_ACCEPT_DATETIME,'DD-MON-YYYY HH24:MI'),
                accept_latitude = :APP_LATITUDE,
                accept_longitude = :APP_LONGITUDE,
                workflow_status = 'AUTHORISED',
                current_step = 'AUTHORISATION',
                modified_by = NVL(V('APP_USER'), USER),
                modified_date = CURRENT_TIMESTAMP
            WHERE permit_id = :P5_PERMIT_ID;
      
            COMMIT;
      
          apex_application.g_print_success_message :=
              CASE WHEN :REQUEST = 'AUTHORISE'
                   THEN 'Permit ' || :P5_PERMIT_NUMBER || ' has been authorised.'
                   ELSE 'Permit ' || :P5_PERMIT_NUMBER || ' saved successfully.'
              END;
          
          :P5_WORKFLOW_STATUS := 'AUTHORISED';
      
      EXCEPTION
          WHEN OTHERS THEN
              ROLLBACK;
              apex_error.add_error(
                  p_message => 'Error saving authorisation data: ' || SQLERRM,
                  p_display_location => apex_error.c_inline_in_notification
              );
      --        RAISE;
      END;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    type: Item = Value
    item: P5_WORKFLOW_STATUS
    value: IN_PROGRESS

