dynamic-actions: 
- # ====== Dynamic Action: Save Signatures =====================
  id: 31607259171440634
  identification: 
    name: Save Signatures

  execution: 
    sequence: 30
    event-scope: Static
    type: Immediate

  when: 
    event: Custom
    custom-event: apexbeforepagesubmit
    selection-type: JavaScript Expression
    javascript-expression: document

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 33353206048951446
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        saveSignatures();
        

    execution: 
      sequence: 10
      event: Save Signatures # 31607259171440634
      fire-when-event-result-is: True
      fire-on-initialization: false

- # ====== Dynamic Action: Initialise page =====================
  id: 33352838421951442
  identification: 
    name: Initialise page

  execution: 
    sequence: 2
    event-scope: Static

  when: 
    event: Page Load

  actions: 
  - # ====== Action: Signatures ==================================
    id: 33352979633951443
    identification: 
      name: Signatures
      action: Execute JavaScript Code

    settings: 
      code: |
        initSignaturePads();
        
        // If read-only, disable canvases after pads have initialised
        setTimeout(function() {
            var status = apex.item('P5_WORKFLOW_STATUS').getValue();
            if (status !== 'IN_PROGRESS' && status !== '') {
                ['authSignaturePad', 'acceptSignaturePad'].forEach(function(id) {
                    var canvas = document.getElementById(id);
                    if (canvas) {
                        canvas.style.pointerEvents = 'none';
                        canvas.style.opacity       = '0.6';
                        canvas.style.cursor        = 'not-allowed';
                        canvas.title               = 'This permit is read-only';
                    }
                });
            }
        }, 250);

    execution: 
      sequence: 20
      event: Initialise page # 33352838421951442
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Connection UI ===============================
    id: 33353070566951444
    identification: 
      name: Connection UI
      action: Execute JavaScript Code

    settings: 
      code: |
        updateConnectionUI();
        window.addEventListener('online',  updateConnectionUI);
        window.addEventListener('offline', updateConnectionUI);
        
        window.addEventListener('resize', function() {
            initSignaturePads();
        });

    execution: 
      sequence: 60
      event: Initialise page # 33352838421951442
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Manage Offline ==============================
    id: 33353132786951445
    identification: 
      name: Manage Offline
      action: Execute JavaScript Code

    settings: 
      code: |
        OfflineStorage.initDB();
        ConnectionManager.init();

    execution: 
      sequence: 70
      event: Initialise page # 33352838421951442
      fire-when-event-result-is: True
      fire-on-initialization: false

  - # ====== Action: Load Signatures =============================
    id: 37955275603176013
    identification: 
      name: Load Signatures
      action: Execute JavaScript Code

    settings: 
      code: |
        var authData   = apex.item('P5_AUTH_SIGNATURE_DATA').getValue();
        var acceptData = apex.item('P5_ACCEPT_SIGNATURE_DATA').getValue();
        
        if (authData) {
            loadSignature(authSignaturePad,
                document.getElementById('authSignaturePad'),
                'data:image/png;base64,' + authData);
        }
        if (acceptData) {
            loadSignature(acceptSignaturePad,
                document.getElementById('acceptSignaturePad'),
                'data:image/png;base64,' + acceptData);
        }

    execution: 
      sequence: 50
      event: Initialise page # 33352838421951442
      fire-when-event-result-is: True
      fire-on-initialization: false

    server-side-condition: 
      type: Never

  - # ====== Action: Load the Auth person details ================
    id: 37955420884176015
    identification: 
      name: Load the Auth person details
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: |
        BEGIN
            SELECT mobile_no,
                   first_name || ' ' || last_name
            INTO   :P5_AUTH_PERSON_MOBILE,
                   :P5_AUTH_PERSON_DISPLAY
            FROM   ptw_pro.ptw_lv_users
            WHERE  UPPER(username) = UPPER(:P5_AUTH_PERSON_SELECT);
        EXCEPTION
            WHEN NO_DATA_FOUND THEN
                :P5_AUTH_PERSON_MOBILE  := NULL;
                :P5_AUTH_PERSON_DISPLAY := NULL;
        END;
      items-to-submit: 
      - P5_AUTH_PERSON_SELECT
      items-to-return: 
      - P5_AUTH_PERSON_DISPLAY
      - P5_AUTH_PERSON_MOBILE
      suppress-change-event: false

    execution: 
      sequence: 40
      event: Initialise page # 33352838421951442
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

- # ====== Dynamic Action: Set Page Read-Only when not IN_PROGRE
  id: 37954230775176003
  identification: 
    name: Set Page Read-Only when not IN_PROGRESS

  execution: 
    sequence: 70
    event-scope: Static

  when: 
    event: Page Load

  server-side-condition: 
    type: Expression
    language: PL/SQL
    pl/sql-expression: ":P5_WORKFLOW_STATUS IN ('AUTHORISED', 'STARTED')"

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 37954370773176004
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |2
         // Disable signature canvases
         ['authSignaturePad', 'acceptSignaturePad'].forEach(function(id) {
             var canvas = document.getElementById(id);
             if (canvas) {
                 canvas.style.pointerEvents = 'none';
                 canvas.style.opacity       = '0.6';
                 canvas.style.cursor        = 'not-allowed';
                 canvas.title               = 'This permit is read-only';
                     }
             });
        // Hide Clear Signature buttons
        $('#BTN_CLEAR_AUTH_SIG_P5, #BTN_CLEAR_ACCEPT_SIG_P5').hide();
        // Hide Save Draft and Authorise buttons when read-only
        //$('#BTN_SAVE_DRAFT_P5, #BTN_START_PERMIT_P5').hide();
        // Disable all editable items via APEX API
        apex.item('P5_AUTH_PERSON_SELECT').disable();
        apex.item('P5_AUTH_DATETIME').disable();
        apex.item('P5_ACCEPT_PERSON_NAME').disable();
        apex.item('P5_ACCEPT_PERSON_COMPANY').disable();
        apex.item('P5_ACCEPT_DATETIME').disable();
        

    execution: 
      sequence: 10
      event: Set Page Read-Only when not IN_PROGRESS # 37954230775176003
      fire-when-event-result-is: True
      fire-on-initialization: false

- # ====== Dynamic Action: Authorisors mobile No load ==========
  id: 37954826633176009
  identification: 
    name: Authorisors mobile No load

  execution: 
    sequence: 90
    event-scope: Static
    type: Immediate

  when: 
    event: Change
