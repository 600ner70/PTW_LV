- # ====== Region: Location ====================================
  id: 58110169498870687
  identification: 
    name: Location
    type: Map

  source: 
    location: None

  layout: 
    sequence: 70
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Blank with Attributes
    template-options: 
    - '#DEFAULT#'
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    static-id: history_map
    region-display-selector: false
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    id: 29752025641080897
    map: 
      background: Built-In
      standard: OpenStreetMap Bright
      dark-mode: Same as Standard
      height: 640

    controls: 
      navigation-bar: Zoom and Compass
      navigation-bar-position: End
      options: 
      - Scale Bar
      - Infinite Map
      - Rectangle Zoom

    initial-position-and-zoom: 
      type: SQL Query
      sql-query: |
        SELECT longitude,
               latitude,
               18 AS zoomlevel
        FROM   (
            SELECT longitude,
                   latitude,
                   created_date,
                   ROW_NUMBER() OVER (ORDER BY created_date DESC) AS rn
            FROM   ptw_pro.ptw_stage_locations
            WHERE  permit_id    = :P7_PERMIT_ID
            AND    permit_stage = :P7_CURRENT_STAGE
        )
        WHERE rn = 1
      geometry-column-data-type: Longitude/Latitude
      initial-longitude-column: LONGITUDE
      initial-latitude-column: LATITUDE
      initial-zoomlevel-column: ZOOMLEVEL

    legend: 
      show: false

    attributes: 
      messages-position: Below
      unit-system: Metric

    performance: 
      lazy-loading: true

    layers: 
    - # ====== Layer: Location =====================================
      id: 29752518329080894
      identification: 
        name: Location
        layer-type: Points

      layout: 
        sequence: 10

      source: 
        location: Local Database
        type: SQL Query
        sql-query: |
          select PERMIT_ID,
                 CASE PERMIT_STAGE
                  WHEN 'SITE_WORK_DETAILS' THEN 'Step 1: Site and Work Details'
                  WHEN 'CONTROL_MEASURES'  THEN 'Step 2: Control Measures'
                  WHEN 'EQUIP_ISOLATION'   THEN 'Step 3: Equipment Isolation'
                  WHEN 'AUTHORISATION'     THEN 'Step 4: Authorisation'
                  WHEN 'COMPLETED'         THEN 'Step 5: Live'
                  WHEN 'MONITORING'        THEN 'Step 6: Monitoring'
                  WHEN 'CLEARANCE'         THEN 'Step 7: Clearnace'
                  WHEN 'CANCELLED'         THEN 'Cancelled'
                 ELSE PERMIT_STAGE
                 END as step_display,
                 LATITUDE,
                 LONGITUDE,
                 CREATED_DATE,
                 CREATED_BY,
                 PERMIT_STAGE
          from   (SELECT MAX(psl.CREATED_DATE) created_date,
                         psl.LONGITUDE,
                         psl.LATITUDE,
                         psl.permit_id,
                         psl.permit_stage,
                         psl.created_by      
                  FROM   PTW_PRO.PTW_STAGE_LOCATIONS psl
                  WHERE  psl.PERMIT_ID    = :P7_PERMIT_ID 
                  AND    psl.PERMIT_STAGE = :P7_CURRENT_STAGE
                  GROUP BY psl.permit_id,
                           psl.permit_stage,
                           psl.LONGITUDE,
                           psl.LATITUDE,
                           psl.created_by) map_data
          
        page-items-to-submit: 
        - P7_PERMIT_ID
        - P7_CURRENT_STAGE
        - P7_CREATED_DATE
        use-spatial-index: false

      column-mapping: 
        geometry-column-data-type: Longitude/Latitude
        longitude-column: LONGITUDE
        latitude-column: LATITUDE

      point-objects: 
        style: SVG
        shape: Pin Circle
        shape-scale: 3

      appearance: 
        fill-color: '#182bfc'

      point-clustering: 
        enable: false

      tooltip: 
        advanced-formatting: false

      info-window: 
        advanced-formatting: false

      legend: 
        show: true
        enable-to-hide: true

