---
# ====== Page: PTW PDF Report ================================
id: 300
identification: 
  name: PTW PDF Report
  alias: PTW-PDF-REPORT
  title: PTW PDF Report

appearance: 
  page-mode: Normal
  page-template: Minimal (No Navigation)
  template-options: 
  - '#DEFAULT#'

navigation-menu: 
  override-user-interface-level: false

navigation: 
  cursor-focus: Do not focus cursor
  warn-on-unsaved-changes: true

css: 
  inline: |
    /* =====================================================
       GP15 COMMERCIAL GAS SERVICE REPORT - PROFESSIONAL PDF CSS
       Optimized for A4 printing with efficient space usage
       ===================================================== */
    
    /* PRINT SETTINGS */
    @media print {
        .t-Body-nav,
        .t-Header,
        .apex-button-group,
        #print-button-region,
        .no-print {
            display: none !important;
        }
        
        .gp15-section {
            page-break-inside: avoid;
        }
        
        h4 {
            page-break-after: avoid;
        }
        
        @page {
            size: A4 portrait;
            margin: 10mm 12mm 10mm 12mm;
        }
        
        body {
            background: white !important;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
    }
    
    /* MAIN CONTAINER */
    .gp15-report-container {
        max-width: 210mm;
        margin: 0 auto;
        padding: 0;
        background: white;
        font-family: 'Segoe UI', 'Arial', sans-serif;
        font-size: 9pt;
        color: #1a1a1a;
        line-height: 1.35;
        box-shadow: 0 0 15px rgba(0,0,0,0.08);
    }
    
    /* HEADER - Compact professional design */
    .gp15-header {
        background: linear-gradient(135deg, #1a3a5c 0%, #2d5a8c 100%);
        color: white;
        padding: 18px 25px 16px 25px;
        margin-bottom: 0;
        border-bottom: 3px solid #0d2942;
    }
    
    .gp15-header h1 {
        font-size: 20pt;
        margin: 0 0 8px 0;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }
    
    .gp15-header .permit-number {
        font-size: 14pt;
        font-weight: 600;
        margin: 6px 0;
        background: rgba(255,255,255,0.15);
        display: inline-block;
        padding: 4px 14px;
        border-radius: 4px;
        border: 1px solid rgba(255,255,255,0.3);
    }
    
    .gp15-header > div:last-child {
        display: flex;
        justify-content: space-between;
        margin-top: 10px;
        font-size: 9.5pt;
        opacity: 0.95;
    }
    
    /* COMPANY LOGO */
    .company-logo {
        background: rgba(255,255,255,0.95);
        padding: 8px 12px;
        border-radius: 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 50px;
        min-width: 120px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        margin-bottom: 10px;
    }
    
    .company-logo img {
        max-height: 50px;
        max-width: 180px;
        display: block;
    }
    
    .company-logo:empty::before {
        content: 'YOUR COMPANY';
        color: #1a3a5c;
        font-weight: 700;
        font-size: 12pt;
        letter-spacing: 0.8px;
    }
    
    /* SECTIONS - Compact with clear borders */
    .gp15-section {
        margin: 0;
        background: white;
        border: 1px solid #c8d1db;
        border-top: none;
    }
    
    .gp15-section:first-of-type {
        border-top: 1px solid #c8d1db;
    }
    
    .gp15-section-title {
        background: linear-gradient(to bottom, #e8ecf1 0%, #dce3ea 100%);
        padding: 8px 16px;
        font-weight: 700;
        font-size: 10pt;
        color: #1a3a5c;
        border-bottom: 2px solid #b0bcc9;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    /* DATA ROWS - Clean and efficient */
    .gp15-row {
        display: flex;
        padding: 6px 16px;
        border-bottom: 1px solid #e8ecf1;
        align-items: center;
    }
    
    .gp15-row:last-child {
        border-bottom: none;
    }
    
    .gp15-row:nth-child(even) {
        background: #f8f9fb;
    }
    
    .gp15-label {
        font-weight: 600;
        width: 38%;
        padding-right: 12px;
        color: #2c3e50;
        font-size: 9pt;
        flex-shrink: 0;
    }
    
    .gp15-value {
        width: 62%;
        color: #1a1a1a;
        font-size: 9pt;
        word-wrap: break-word;
    }
    
    /* TABLES - Professional grid design */
    .gp15-table {
        width: 100%;
        border-collapse: collapse;
        margin: 0;
        font-size: 8.5pt;
        background: white;
    }
    
    .gp15-table th {
        background: linear-gradient(to bottom, #2c3e50 0%, #1a2836 100%);
        color: white;
        padding: 7px 6px;
        font-weight: 600;
        text-align: left;
        font-size: 8.5pt;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        border: 1px solid #1a2836;
    }
    
    .gp15-table td {
        border: 1px solid #c8d1db;
        padding: 6px 6px;
        color: #1a1a1a;
        vertical-align: middle;
    }
    
    .gp15-table tr:nth-child(even) {
        background: #f8f9fb;
    }
    
    .gp15-table td strong {
        color: #1a3a5c;
        font-weight: 600;
    }
    
    /* Compact table for appliance details */
    .gp15-table.compact th,
    .gp15-table.compact td {
        padding: 5px 4px;
        font-size: 8pt;
    }
    
    /* SUBSECTION HEADERS */
    h4 {
        color: #1a3a5c;
        font-size: 9.5pt;
        font-weight: 600;
        margin: 12px 16px 8px 16px;
        padding-bottom: 4px;
        border-bottom: 2px solid #3498db;
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }
    
    /* SIGNATURE BOXES - Clear professional display */
    .signature-box {
        border: 2px solid #b0bcc9;
        min-height: 65px;
        height: 65px;
        padding: 8px;
        margin-top: 6px;
        background: #fafbfc;
        border-radius: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    
    .signature-image {
        max-width: 100%;
        max-height: 55px;
        display: block;
        object-fit: contain;
    }
    
    .signature-box p {
        margin: 0;
        color: #7f8c9a;
        font-style: italic;
        font-size: 8.5pt;
        text-align: center;
    }
    
    /* SIGNATURE SECTION - Two column grid */
    .signature-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 12px 16px;
    }
    
    .signature-block {
        border: 1px solid #dce3ea;
        padding: 10px;
        background: white;
        border-radius: 3px;
    }
    
    .signature-block strong {
        display: block;
        margin-bottom: 6px;
        color: #1a3a5c;
        font-size: 9.5pt;
    }
    
    .signature-details {
        margin-top: 6px;
        font-size: 8.5pt;
        line-height: 1.5;
        color: #2c3e50;
    }
    
    .signature-details strong {
        display: inline;
        font-size: 8.5pt;
        font-weight: 600;
    }
    
    /* DECLARATION BOX - Prominent notice */
    .declaration-box {
        background: linear-gradient(135deg, #fff9e6 0%, #fff3cc 100%);
        border: 2px solid #f5c563;
        border-left: 4px solid #e6a023;
        padding: 14px 16px;
        margin: 12px 16px;
        font-weight: 500;
        border-radius: 3px;
        box-shadow: 0 2px 4px rgba(230, 160, 35, 0.15);
    }
    
    .declaration-box strong {
        display: block;
        font-size: 10pt;
        color: #7d5d1f;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
    }
    
    .declaration-box p {
        color: #7d5d1f;
        margin: 0;
        line-height: 1.5;
        font-size: 9pt;
    }
    
    /* GRID LAYOUTS - Compact spacing */
    .gp15-grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 10px 16px;
    }
    
    .gp15-grid-3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
        padding: 10px 16px;
    }
    
    /* FOOTER - Minimal professional */
    .gp15-footer {
        text-align: center;
        margin-top: 0;
        padding: 12px 16px;
        background: #f0f3f6;
        border-top: 2px solid #b0bcc9;
        font-size: 7.5pt;
        color: #6c757d;
        line-height: 1.4;
    }
    
    .gp15-footer strong {
        color: #495057;
        font-weight: 600;
    }
    
    /* STATUS BADGES */
    .status-badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 10px;
        font-size: 8pt;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.2px;
    }
    
    .status-yes {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }
    
    .status-no {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }
    
    .status-na {
        background: #e2e3e5;
        color: #383d41;
        border: 1px solid #d6d8db;
    }
    
    /* INFO BOXES - Visual emphasis */
    .info-box {
        background: #e7f3ff;
        border: 1px solid #90c9f9;
        border-left: 3px solid #2196F3;
        padding: 10px 14px;
        margin: 10px 16px;
        border-radius: 2px;
        font-size: 9pt;
    }
    
    .warning-box {
        background: #fff9e6;
        border: 1px solid #f5d68f;
        border-left: 3px solid #ffc107;
        padding: 10px 14px;
        margin: 10px 16px;
        border-radius: 2px;
        font-size: 9pt;
    }
    
    .danger-box {
        background: #ffe8ea;
        border: 1px solid #f5b7bd;
        border-left: 3px solid #dc3545;
        padding: 10px 14px;
        margin: 10px 16px;
        border-radius: 2px;
        font-size: 9pt;
    }
    
    /* TEXT CONTENT AREAS */
    .text-content {
        padding: 10px 16px;
        line-height: 1.5;
        font-size: 9pt;
    }
    
    .text-content strong {
        color: #1a3a5c;
        display: block;
        margin-bottom: 4px;
    }
    
    /* COMPACT SECTION PADDING */
    .gp15-section .gp15-table {
        margin: 0;
    }
    
    .gp15-section > .gp15-table:first-child {
        border-top: none;
    }
    
    /* APPLIANCE SUBSECTIONS */
    .appliance-subsection {
        margin: 0;
        border-top: 1px solid #e8ecf1;
    }
    
    .appliance-subsection:first-child {
        border-top: none;
    }
    
    /* GAS SAFE LOGO AREA */
    .gas-safe-logo {
        text-align: right;
        font-weight: 700;
        color: #c0392b;
        font-size: 10pt;
        letter-spacing: 0.3px;
    }
    
    /* RESPONSIVE ADJUSTMENTS */
    @media screen and (max-width: 768px) {
        .gp15-report-container {
            max-width: 100%;
            box-shadow: none;
        }
        
        .gp15-grid-2,
        .gp15-grid-3,
        .signature-grid {
            grid-template-columns: 1fr;
        }
        
        .gp15-header {
            padding: 15px;
        }
        
        .gp15-table {
            font-size: 7.5pt;
        }
    }
    
    /* UTILITY CLASSES */
    .mb-0 { margin-bottom: 0 !important; }
    .mt-0 { margin-top: 0 !important; }
    .no-border-top { border-top: none !important; }
    .no-border-bottom { border-bottom: none !important; }
    
    /* PRINT OPTIMIZATION */
    @media print {
        .gp15-report-container {
            box-shadow: none;
        }
        
        .gp15-section {
            page-break-inside: avoid;
        }
        
        .signature-grid {
            page-break-inside: avoid;
        }
    }
    

security: 
  authentication: Page Requires Authentication
  deep-linking: Application Default
  page-access-protection: Arguments Must Have Checksum
  form-auto-complete: Off
  browser-cache: Application Default

session-management: 
  rejoin-sessions: Application Default

advanced: 
  enable-duplicate-page-submissions: Yes - Enable page to be re-posted
  reload-on-submit: Only for Success

server-cache: 
  caching: Disabled

regions: 
- # ====== Region: Print Buttons ===============================
  id: 67013347421929736
  identification: 
    name: Print Buttons
    type: Static Content

  layout: 
    sequence: 40
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Buttons Container
    template-options: 
    - '#DEFAULT#'
    css-classes: 
    - no-print
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    static-id: print-button-region
    region-display-selector: false
    exclude-title-from-translation: false

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    settings: 
      output-as: HTML
      expand-shortcuts: false

- # ====== Region: PTW Report Content ==========================
  id: 67013758101929740
  identification: 
    name: PTW Report Content
    type: Dynamic Content

  source: 
    language: PL/SQL
    pl/sql-function-body-returning-a-clob: |
      BEGIN
          RETURN ptw_pro.generate_ptw_lv_pdf(p_permit_id => :P300_PERMIT_ID);
      END;
    page-items-to-submit: 
    - P300_PERMIT_ID

  layout: 
    sequence: 50
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Standard
    template-options: 
    - '#DEFAULT#'
    - t-Region--scrollBody
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  server-cache: 
    caching: Disabled

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    performance: 
      lazy-loading: false

page-items: 
- # ====== Page Item: P300_RETURN_PAGE =========================
  id: 49364719163381908
  identification: 
    name: P300_RETURN_PAGE
    type: Hidden

  settings: 
    value-protected: false

  layout: 
    sequence: 30
    region: No Parent
    slot: BODY

  advanced: 
    warn-on-unsaved-changes: Page Default

  source: 
    type: Null
    used: Only when current value in session state is null

  session-state: 
    data-type: VARCHAR2
    storage: Per Session (Persistent)

  security: 
    session-state-protection: Unrestricted
    store-value-encrypted-in-session-state: true
    restricted-characters: All characters can be saved.

- # ====== Page Item: P300_PERMIT_ID ===========================
  id: 67015084508929672
  identification: 
    name: P300_PERMIT_ID
    type: Hidden

  settings: 
    value-protected: false

  layout: 
    sequence: 10
    region: No Parent
    slot: BODY

  advanced: 
    warn-on-unsaved-changes: Page Default

  source: 
    type: Null
    used: Only when current value in session state is null

  session-state: 
    data-type: VARCHAR2
    storage: Per Session (Persistent)

  security: 
    session-state-protection: Unrestricted
    store-value-encrypted-in-session-state: true
    restricted-characters: All characters can be saved.

buttons: 
- # ====== Button: PRINT_PDF ===================================
  id: 42025765972651856
  identification: 
    button-name: PRINT_PDF
    label: Print/Save as PDF

  layout: 
    sequence: 10
    region: Print Buttons # 67013347421929736
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic
    alignment: Left center

  appearance: 
    button-template: Text with Icon
    hot: true
    template-options: 
    - '#DEFAULT#'
    - t-Button--iconLeft
    icon: fa-print

  behavior: 
    action: Defined by Dynamic Action
    execute-validations: true

- # ====== Button: BACK ========================================
  id: 42026152934651854
  identification: 
    button-name: BACK
    label: Back

  layout: 
    sequence: 30
    region: Print Buttons # 67013347421929736
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic
    alignment: Left center

  appearance: 
    button-template: Text with Icon
    hot: false
    template-options: 
    - '#DEFAULT#'
    - t-Button--iconLeft
    icon: fa-arrow-left

  behavior: 
    action: Redirect to Page in this Application
    target: 
      url: 'f?p=&APP_ID.:&P300_RETURN_PAGE.:&SESSION.::&DEBUG.:::'
      page: '&P300_RETURN_PAGE.'

    warn-on-unsaved-changes: Do Not Check

dynamic-actions: 
- # ====== Dynamic Action: New =================================
  id: 42027343623651821
  identification: 
    name: New

  execution: 
    sequence: 10
    event-scope: Static
    type: Immediate

  when: 
    event: Click
    selection-type: Button
    button: PRINT_PDF # 42025765972651856

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 42027840526651816
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: window.print()

    execution: 
      sequence: 10
      event: New # 42027343623651821
      fire-when-event-result-is: True
      fire-on-initialization: false

