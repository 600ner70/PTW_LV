- # ====== Process: Save Permit Type Assignments ===============
  id: 52464836682584445
  identification: 
    name: Save Permit Type Assignments
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      DECLARE
          v_company_id NUMBER;
          v_exists     NUMBER;
          v_used       NUMBER;
          v_type_id    NUMBER;
          v_new_val    VARCHAR2(1);
      BEGIN
          SELECT company_id
          INTO   v_company_id
          FROM   ptw_pro.ptw_lv_users
          WHERE  UPPER(username) = UPPER(SYS_CONTEXT('APEX$SESSION', 'APP_USER'));
      
          FOR i IN 1 .. apex_application.g_f02.count LOOP
              v_type_id := apex_application.g_f02(i);
              v_new_val := apex_application.g_f01(i);
      
              SELECT COUNT(*) INTO v_exists
              FROM   ptw_pro.ptw_lv_company_types
              WHERE  type_id = v_type_id;          -- VPD-scoped
      
              IF v_new_val = 'Y' AND v_exists = 0 THEN
      
                  INSERT INTO ptw_pro.ptw_lv_company_types (company_id, type_id, is_active)
                  VALUES (v_company_id, v_type_id, 'Y');
      
              ELSIF v_new_val = 'N' AND v_exists > 0 THEN
      
                  -- Defense in depth: re-verify not in use before
                  -- removing. The UI never offers "No" for a
                  -- permit_count > 0 row, so this should only ever
                  -- be 0 here - but re-check in case of a tampered
                  -- submission or a permit created moments ago.
                  SELECT COUNT(*) INTO v_used
                  FROM   ptw_pro.ptw_lv_permits p
                  WHERE  p.ptw_type = (SELECT ptw_type FROM ptw_pro.ptw_types
                                         WHERE type_id = v_type_id);
      
                  IF v_used = 0 THEN
                      DELETE FROM ptw_pro.ptw_lv_company_types
                      WHERE  type_id = v_type_id;  -- VPD-scoped
                  END IF;
                  -- else: silently skip - row stays assigned
      
              END IF;
              -- else: unchanged, no-op
      
          END LOOP;
      END;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  success-message: 
    success-message: Permit types updated.

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: SAVE # 52464752525584444

