- # ====== Dynamic Action: Competency Confirm Dialog ===========
  id: 53188781398153111
  identification: 
    name: Competency Confirm Dialog

  execution: 
    sequence: 30
    event-scope: Static
    type: Immediate

  when: 
    event: Change
    selection-type: jQuery Selector
    jquery-selector: .ptw-competency-checkbox

  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 53188810329153112
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        var $cb = $(this.triggeringElement);
        var typeDesc = $cb.data("type-desc");
        
        apex.confirm(
            "Confirm you have personally verified this engineer is " +
            "competent to issue " + typeDesc + "?",
            function(okPressed) {
                if (okPressed) {
                    // P23_COMPETENCY_ACK is a real page item (unlike the
                    // per-row checkbox above), so apex.item() is correct
                    // and Oracle-documented here.
                    apex.item("P23_COMPETENCY_ACK").setValue("Y");
                } else {
                    $cb.prop("checked", false);
                }
            }
        );
        

    affected-elements: 
      selection-type: Event Source

    execution: 
      sequence: 10
      event: Competency Confirm Dialog # 53188781398153111
      fire-when-event-result-is: True
      fire-on-initialization: false

