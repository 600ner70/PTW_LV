- # ====== Region: Super User Current Company ==================
  id: 52496227297962721
  identification: 
    name: Super User Current Company
    type: Dynamic Content

  source: 
    language: PL/SQL
    pl/sql-function-body-returning-a-clob: |
      DECLARE
          v_override  VARCHAR2(50) := V('G_OVERRIDE_COMPANY_ID');
          v_name      VARCHAR2(200);
          v_html      CLOB;
      BEGIN
          IF v_override IS NULL OR v_override = '' THEN
              RETURN NULL;
          END IF;
      
          SELECT company_name
          INTO   v_name
          FROM   ptw_pro.ptw_lv_companies
          WHERE  company_id = TO_NUMBER(v_override);
      
          v_html := '<p><strong>Switched to Company: </strong>' 
                 || apex_escape.html(v_name) || '</p>';
      
          RETURN v_html;
      
      EXCEPTION
          WHEN OTHERS THEN RETURN NULL;
      END;

  layout: 
    sequence: 50
    parent-region: No Parent
    slot: BODY
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

  appearance: 
    template: Title Bar
    template-options: 
    - '#DEFAULT#'
    - t-BreadcrumbRegion--useBreadcrumbTitle
    render-components: Above Content

  accessibility: 
    use-landmark: true
    landmark-type: Template Default

  advanced: 
    region-display-selector: false
    exclude-title-from-translation: false

  server-side-condition: 
    type: Function Body
    language: PL/SQL
    pl/sql-function-body: |
      DECLARE
          v_is_super VARCHAR2(1);
      BEGIN
          SELECT is_super_user INTO v_is_super
          FROM   ptw_pro.ptw_lv_users
          WHERE  UPPER(username) = UPPER(:APP_USER)
          AND    is_active = 'Y';
          RETURN v_is_super = 'Y';
      EXCEPTION
          WHEN OTHERS THEN RETURN FALSE;
      END;

  server-cache: 
    caching: Disabled

  customization: 
    customizable: Not Customizable By End Users

  attributes: 
    performance: 
      lazy-loading: false

