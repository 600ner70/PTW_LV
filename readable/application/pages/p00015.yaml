- # ====== Process: Populate items =============================
  id: 47748162967890003
  identification: 
    name: Populate items
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      BEGIN
        SELECT workflow_status
        INTO   :P15_WORKFLOW_STATUS
        FROM   ptw_pro.ptw_lv_permits
        WHERE  permit_id = :P15_PERMIT_ID;
      EXCEPTION
        WHEN OTHERS THEN
          NULL;
      END;
      
      

  execution: 
    sequence: 10
    point: After Header
    run-process: Once Per Page Visit (default)

