- # ====== Region: Monitoring report ===========================
  id: 41968196091328812
  identification: 
    name: Monitoring report
    title: List
    type: Interactive Report

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT monitoring_id,
             permit_id,
             'LV MONITORING' AS ptw_type,
             monitor_name,
             monitor_date,
             monitoring_status,
             CASE monitoring_status
                 WHEN 'IN_PROGRESS' THEN
                     '<a href="' 
                     || apex_page.get_url(
                          p_page        => 10,
                          p_clear_cache => '10',
                          p_items       => 'P10_PERMIT_ID,P10_MONITORING_ID',
                          p_values      => permit_id || ',' || monitoring_id
                        )
                     || '"><span class="fa fa-pencil" title="Edit"></span></a>'
                 ELSE
                     '<a href="'
                     || apex_page.get_url(
                          p_page        => 10,
                          p_clear_cache => '10',
                          p_items       => 'P10_PERMIT_ID,P10_MONITORING_ID',
                          p_values      => permit_id || ',' || monitoring_id
                        )
                     || '"><span class="fa fa-eye" title="View"></span></a>'
             END AS action_link
      FROM   ptw_pro.ptw_lv_monitoring
      WHERE  permit_id = :P15_PERMIT_ID
      ORDER BY monitor_date DESC
    page-items-to-submit: 
    - P15_PERMIT_ID
    - P15_PTW_TYPE

  layout: 
    sequence: 10
    parent-region: Monitoring # 41968861118328819
    slot: SUB_REGIONS
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic

