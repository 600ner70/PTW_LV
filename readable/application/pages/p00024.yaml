  server-side-condition: 
    when-button-pressed: SAVE # 52416184904182125

- # ====== Validation: Company Code Must Be Unique =============
  id: 52416710609182131
  identification: 
    name: Company Code Must Be Unique

  execution: 
    sequence: 20

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      DECLARE
          v_count NUMBER;
      BEGIN
          -- company_code has a UNIQUE constraint but is nullable;
          -- NULLs don't violate uniqueness, so only check when a
          -- value is actually entered.
          IF :P24_COMPANY_CODE IS NULL THEN
              RETURN TRUE;
          END IF;
      
          SELECT COUNT(*) INTO v_count
          FROM   ptw_pro.ptw_lv_companies
          WHERE  UPPER(company_code) = UPPER(:P24_COMPANY_CODE)
          AND    (company_id != :P24_COMPANY_ID OR :P24_COMPANY_ID IS NULL);
          RETURN v_count = 0;
      END;
    always-execute: false

  error: 
    error-message: This Company Code is already in use by another company. Please choose a different code, or leave it blank.
    display-location: Inline with Field and in Notification
    associated-item: P24_COMPANY_CODE # 52415614297182120

  server-side-condition: 
    when-button-pressed: SAVE # 52416184904182125

- # ====== Validation: Prefix Required and Valid ===============
  id: 52496007143962719
  identification: 
    name: Prefix Required and Valid

  execution: 
    sequence: 30

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      DECLARE
          v_prefix VARCHAR2(4) := TRIM(:P24_PERMIT_PREFIX);
      BEGIN
          -- Only validate in create mode (item is hidden on edit)
          IF :P24_COMPANY_ID IS NOT NULL THEN
              RETURN TRUE;
          END IF;
      
          RETURN v_prefix IS NOT NULL
             AND LENGTH(v_prefix) BETWEEN 1 AND 4
             AND UPPER(v_prefix) = v_prefix;
      END;
    always-execute: false

  error: 
    error-message: Permit Number Prefix is required and must be 1-4 uppercase letters (e.g. MWM).
    display-location: Inline with Field and in Notification
    associated-item: P24_PERMIT_PREFIX # 52495863962962717

- # ====== Validation: Prefix Must Be Unique ===================
  id: 52496175209962720
  identification: 
    name: Prefix Must Be Unique

  execution: 
    sequence: 40

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      DECLARE
          v_count NUMBER;
      BEGIN
          -- Only validate in create mode
          IF :P24_COMPANY_ID IS NOT NULL THEN
              RETURN TRUE;
          END IF;
      
          SELECT COUNT(*) INTO v_count
          FROM   ptw_pro.ptw_lv_companies
          WHERE  UPPER(permit_prefix) = UPPER(TRIM(:P24_PERMIT_PREFIX));
      
          RETURN v_count = 0;
      END;
    always-execute: false

  error: 
    error-message: This prefix is already used by another company. Please choose a different one.
    display-location: Inline with Field and in Notification
    associated-item: P24_PERMIT_PREFIX # 52495863962962717

processes: 
- # ====== Process: Fetch Company ==============================
  id: 52416338328182127
  identification: 
    name: Fetch Company
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      BEGIN
          --
          SELECT c.company_name,
                 c.company_code,
                 c.permit_prefix,
                 c.is_active,
                 c.header_text,
                 TO_CHAR(c.created_date, 'DD-MON-YYYY') AS created_date,
                 (SELECT COUNT(*) FROM ptw_pro.ptw_lv_users u
                   WHERE u.company_id = c.company_id)   AS user_count
          INTO   :P24_COMPANY_NAME,
                 :P24_COMPANY_CODE,
                 :P24_PERMIT_PREFIX_DISPLAY,
                 :P24_IS_ACTIVE,
                 :P24_HEADER_TEXT,
                 :P24_CREATED_DATE,
                 :P24_USER_COUNT
          FROM   ptw_pro.ptw_lv_companies c
          WHERE  company_id = :P24_COMPANY_ID
          ORDER  BY c.company_name;
      END;
      

  execution: 
    sequence: 10
    point: Before Header
    run-process: Once Per Page Visit (default)

  server-side-condition: 
    type: Item is NOT NULL
    item: P24_COMPANY_ID

- # ====== Process: Save Company ===============================
  id: 52416461002182128
  identification: 
    name: Save Company
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      IF :P24_COMPANY_ID IS NOT NULL THEN
      
          DECLARE
              l_db_comp_is_active VARCHAR2(1);
          BEGIN
              --
              SELECT is_active
              INTO   l_db_comp_is_active
              FROM   ptw_pro.ptw_lv_companies
              WHERE  company_id = :P24_COMPANY_ID;
              --
              IF l_db_comp_is_active != :P24_IS_ACTIVE THEN
                  --
                  UPDATE ptw_pro.ptw_lv_companies
                  SET    is_active = :P24_IS_ACTIVE
                  WHERE  company_id = :P24_COMPANY_ID;
              END IF;
          END;
      
      ELSE
      
          INSERT INTO ptw_pro.ptw_lv_companies
              (company_name, company_code, is_active, permit_prefix, header_text)
          VALUES (
              :P24_COMPANY_NAME,
              :P24_COMPANY_CODE,
              :P24_IS_ACTIVE,
              :P24_PERMIT_PREFIX,
              :P24_HEADER_TEXT
          );
      
      END IF;
      
      

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

