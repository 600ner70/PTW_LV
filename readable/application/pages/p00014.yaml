    when-button-pressed: CREATE # 40553968345170621

- # ====== Validation: Company required for Super User =========
  id: 52465166751584448
  identification: 
    name: Company required for Super User

  execution: 
    sequence: 20

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      DECLARE
          l_count NUMBER;
      BEGIN
          SELECT COUNT(*)
          INTO   l_count
          FROM   ptw_pro.ptw_lv_users
          WHERE  UPPER(username) = UPPER(:APP_USER)
          AND    is_super_user = 'Y'
          AND    is_active = 'Y';
      
          IF l_count > 0 AND :P14_COMPANY_ID IS NULL THEN
            RETURN 'Super User - Please select a company before continuing.';
          END IF;
      END;
    always-execute: false

  error: 
    display-location: Inline with Field and in Notification
    associated-item: P14_COMPANY_ID # 52465015239584447

  server-side-condition: 
    when-button-pressed: CREATE # 40553968345170621

