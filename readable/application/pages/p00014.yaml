- # ====== Page Item: P14_PTW_TYPES ============================
  id: 40553683189170618
  identification: 
    name: P14_PTW_TYPES
    type: Select List

  label: 
    label: Available types
    alignment: Left

  settings: 
    page-action-on-selection: None

  multiple-values: 
    type: No

  layout: 
    sequence: 20
    region: PTW available types # 40553413561170616
    slot: BODY
    alignment: Left
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic
    label-column-span: Page Template Default

  appearance: 
    template: Optional - Floating
    template-options: 
    - '#DEFAULT#'
    height: 1

  validation: 
    value-required: false

  list-of-values: 
    type: SQL Query
    sql-query: |
      SELECT t.type_desc d,
             t.ptw_type  r
      FROM   ptw_pro.ptw_types t
      JOIN   ptw_pro.ptw_lv_company_types ct ON ct.type_id = t.type_id
      WHERE  t.available = 'Y'
      AND    ct.is_active = 'Y'
      AND    ct.company_id in (SELECT company_id
                               FROM   ptw_pro.ptw_lv_users
                               WHERE ((UPPER(username) = UPPER(v('APP_USER'))
                               AND    is_super_user <> 'Y')
                               OR     (company_id = :P14_COMPANY_ID)))
      ORDER  BY t.type_desc
    display-extra-values: false
    display-null-value: true
    null-display-value: '- Select -'

  cascading-list-of-values: 
    parent-item(s): 
    - P14_COMPANY_ID
    items-to-submit: 
    - P14_COMPANY_ID
    parent-required: true

  advanced: 
    warn-on-unsaved-changes: Page Default

  source: 
    type: Null
    used: Only when current value in session state is null

  session-state: 
    storage: Per Session (Persistent)

  quick-picks: 
    show-quick-picks: false

  security: 
    session-state-protection: Unrestricted
    store-value-encrypted-in-session-state: true
    restricted-characters: All characters can be saved.

- # ====== Page Item: P14_COMPANY_ID ===========================
  id: 52465015239584447
  identification: 
    name: P14_COMPANY_ID
    type: Select List

  label: 
    label: Create permit for company
    alignment: Left

  settings: 
    page-action-on-selection: None

  multiple-values: 
    type: No

  layout: 
    sequence: 10
    region: PTW available types # 40553413561170616
    slot: BODY
    alignment: Left
    start-new-layout: false
    start-new-row: true
    column: Automatic
    new-column: true
    column-span: Automatic
    label-column-span: Page Template Default

  appearance: 
    template: Optional - Floating
    template-options: 
    - '#DEFAULT#'
    height: 1

  validation: 
    value-required: false

  list-of-values: 
    type: SQL Query
    sql-query: |
      SELECT company_name d,
             company_id   r
      FROM   ptw_pro.ptw_lv_companies
      WHERE  is_active = 'Y'
      ORDER  BY company_name
    display-extra-values: false
    display-null-value: true
    null-display-value: '-- Select --'

  advanced: 
    warn-on-unsaved-changes: Page Default

  source: 
    type: Expression
    language: PL/SQL
    pl/sql-expression: V('G_OVERRIDE_COMPANY_ID')
    used: Only when current value in session state is null

  session-state: 
    storage: Per Session (Persistent)

  quick-picks: 
    show-quick-picks: false

  server-side-condition: 
    type: Rows returned
    sql-query: |
      SELECT 1 
      FROM ptw_pro.ptw_lv_users
      WHERE UPPER(username) = UPPER(:APP_USER)
      AND   is_super_user = 'Y'
      AND   is_active = 'Y'

  security: 
    session-state-protection: Unrestricted
    store-value-encrypted-in-session-state: true
    restricted-characters: All characters can be saved.

