- # ====== Process: Set Company Override =======================
  id: 52465285312584449
  identification: 
    name: Set Company Override
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      DECLARE
        l_count NUMBER;
      BEGIN
          SELECT COUNT(*)
          INTO   l_count
          FROM   ptw_pro.ptw_lv_users
          WHERE  UPPER(username) = UPPER(:APP_USER)
          AND    is_super_user = 'Y'
          AND    is_active = 'Y';
          
          IF l_count > 0 THEN
              APEX_UTIL.SET_SESSION_STATE('G_OVERRIDE_COMPANY_ID', :P14_COMPANY_ID);
          END IF;
      END;

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: CREATE # 40553968345170621

