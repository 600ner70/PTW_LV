        padding: 1rem;
        margin-bottom: 1rem;
        background: #fff;
    }
    
    .method-check-box h4 {
        margin: 0 0 0.75rem 0;
        font-size: 0.95rem;
        font-weight: 600;
        color: #003366;
    }
    
    .col-a-header {
        background: #e8f0fb;
        padding: 0.5rem;
        border-radius: 4px;
        font-weight: 600;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 0.5rem;
    }
    
    .col-b-header {
        background: #fef8e7;
        padding: 0.5rem;
        border-radius: 4px;
        font-weight: 600;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 0.5rem;
    }
    
    .geo-info {
        font-size: 0.72rem;
        color: #999;
        margin-top: 4px;
    }
    

