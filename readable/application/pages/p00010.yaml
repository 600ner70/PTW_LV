        font-style: italic;
        margin-bottom: 1rem;
        padding: 0.75rem 1rem;
        background: #f0f4fa;
        border-left: 4px solid #003366;
        border-radius: 4px;
    }
    
    .monitoring-checks-grid {
        width: 100%;
