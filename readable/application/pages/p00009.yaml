- # ====== Validation: End after Start =========================
  id: 37957713806176038
  identification: 
    name: End after Start

  execution: 
    sequence: 30

  validation: 
    type: Function Body (returning Error Text)
    language: PL/SQL
    pl/sql-function-body-returning-error-text: |
      BEGIN
        IF :P9_END_DATE <= :P9_START_DATE THEN
          RETURN 'End Date must be after Start Date.';
        END IF;
      END;
    always-execute: false

  error: 
    display-location: Inline with Field and in Notification

  server-side-condition: 
    type: Item = Value
    item: P9_START_MODE
    value: SCHEDULED

- # ====== Validation: Max of 12 hours =========================
  id: 37957836247176039
  identification: 
    name: Max of 12 hours

  execution: 
    sequence: 40

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      BEGIN
          RETURN NOT (
              :P9_START_MODE = 'SCHEDULED' AND
              :P9_START_DATE IS NOT NULL AND
              :P9_END_DATE IS NOT NULL AND
              (TO_DATE(:P9_END_DATE, 'DD-MON-YYYY HH24:MI') - 
               TO_DATE(:P9_START_DATE, 'DD-MON-YYYY HH24:MI')) * 24 > 12
          );
      EXCEPTION WHEN OTHERS THEN RETURN TRUE;
      END;
    always-execute: false

  error: 
    error-message: A permit can only be open for maximum of 12 hours.
    display-location: Inline with Field and in Notification

processes: 
- # ====== Process: Start Permit ===============================
  id: 37957981155176040
  identification: 
    name: Start Permit
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      DECLARE
          v_from_dt DATE;
          v_to_dt   DATE;
          v_now     DATE := SYSDATE;
      BEGIN
          IF :P9_START_MODE = 'IMMEDIATE' THEN
              v_from_dt := v_now;
              v_to_dt   := v_now + 12/24;
          ELSE
              v_from_dt := TO_DATE(:P9_START_DATE, 'DD-MON-YYYY HH24:MI');
              v_to_dt   := TO_DATE(:P9_END_DATE,   'DD-MON-YYYY HH24:MI');
          END IF;
      
          UPDATE ptw_pro.ptw_lv_permits
          SET    workflow_status    = 'STARTED',
                 current_step       = 'LIVE',
                 started_datetime   = v_from_dt,
                 ended_datetime     = v_to_dt,
                 started_latitude   = TO_NUMBER(:APP_LATITUDE),
                 started_longitude  = TO_NUMBER(:APP_LONGITUDE),
                 modified_by        = V('APP_USER'),
                 modified_date      = v_now
          WHERE  permit_id = :P9_PERMIT_ID;
      
          IF SQL%ROWCOUNT = 0 THEN
              RAISE_APPLICATION_ERROR(-20001, 'Permit not found.');
          END IF;
      
          COMMIT;
          :P9_WORKFLOW_STATUS := 'STARTED';
          apex_application.g_print_success_message := 'Permit started successfully.';
      EXCEPTION
          WHEN OTHERS THEN
              ROLLBACK;
              apex_error.add_error(
                  p_message          => 'Error starting permit: ' || SQLERRM,
                  p_display_location => apex_error.c_inline_in_notification
              );
      END;

  execution: 
    sequence: 10
    point: After Submit
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    type: Request = Value
    value: START_PERMIT

