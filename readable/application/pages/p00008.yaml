- # ====== Dynamic Action: When the page loads and reloads =====
  id: 39965121194997127
  identification: 
    name: When the page loads and reloads

  execution: 
    sequence: 30
    event-scope: Static

  when: 
    event: Page Load

  server-side-condition: 
    type: Item is NOT NULL
    item: P8_SELECTED_USERNAME

  actions: 
  - # ====== Action: Execute Server-side Code ====================
    id: 39965285764997128
    identification: 
      action: Execute Server-side Code

    settings: 
      language: PE.PROPERTY.SOURCE_SNIPPET_LANG.LOV.PLSQL.D
      pl/sql-code: |
        DECLARE
            l_username VARCHAR2(100);
        BEGIN
            l_username := UPPER(:P8_SELECTED_USERNAME);
        
            BEGIN
                ptw_pro.ptw_sec_pkg.check_user_in_company(l_username);
            EXCEPTION
                WHEN OTHERS THEN
                    apex_error.add_error(
                        p_message          => 'Access denied: this user does not belong to your company.',
                        p_display_location => apex_error.c_inline_in_notification
                    );
                    RETURN;
            END;
        
            -- Verify user exists in APEX
            DECLARE
                l_count NUMBER;
            BEGIN
                SELECT COUNT(*) INTO l_count
                FROM   apex_workspace_apex_users
                WHERE  UPPER(user_name)  = l_username
                AND    workspace_name    = (
                           SELECT workspace FROM apex_applications
                           WHERE  application_id = :APP_ID
                       );
                IF l_count = 0 THEN
                    apex_error.add_error(
                        p_message          => 'User not found: ' || :P8_SELECTED_USERNAME,
                        p_display_location => apex_error.c_inline_in_notification
                    );
                    RETURN;
                END IF;
        
                SELECT au.account_locked
                INTO   :P8_ACCOUNT_LOCKED
                FROM   apex_workspace_apex_users au
                WHERE  UPPER(au.user_name) = l_username
                AND    au.workspace_name   = (SELECT workspace 
                                              FROM   apex_applications
                                              WHERE  application_id = :APP_ID);
            END;
        
            -- Load profile from ptw_lv_users (primary source)
            BEGIN
                SELECT u.first_name,
                       u.last_name,
                       u.email_address,
                       u.mobile_no,
                       u.job_title,
                       u.is_active
                INTO   :P8_FIRST_NAME,
                       :P8_LAST_NAME,
                       :P8_EMAIL,
                       :P8_MOBILE_NO,
                       :P8_DESCRIPTION,
                       :P8_IS_ACTIVE
                FROM   ptw_pro.ptw_lv_users u
                WHERE  UPPER(u.username) = l_username;
            EXCEPTION
                WHEN NO_DATA_FOUND THEN
                    -- No profile row yet - fall back to APEX account data
                    BEGIN
                        SELECT au.email,
                               au.first_name,
                               au.last_name,
                               au.description
                        INTO   :P8_EMAIL,
                               :P8_FIRST_NAME,
                               :P8_LAST_NAME,
                               :P8_DESCRIPTION
                        FROM   apex_workspace_apex_users au
                        WHERE  UPPER(au.user_name) = l_username
                        AND    au.workspace_name   = (
                                   SELECT workspace FROM apex_applications
                                   WHERE  application_id = :APP_ID
                               );
                    EXCEPTION
                        WHEN NO_DATA_FOUND THEN NULL;
                    END;
                    :P8_IS_ACTIVE := 'Y';
            END;
        
            -- Load active role assignments as colon-delimited string
            BEGIN
                SELECT LISTAGG(r.role_name, ':')
                           WITHIN GROUP (ORDER BY r.display_order)
                INTO   :P8_ROLE
                FROM   ptw_pro.ptw_lv_user_role_assignments  ur
                JOIN   ptw_pro.ptw_lv_roles                  r
                    ON r.role_id  = ur.role_id
                JOIN   ptw_pro.ptw_lv_users                  u
                    ON u.user_id  = ur.user_id
                WHERE  UPPER(u.username) = l_username
                AND    ur.is_active      = 'Y';
            EXCEPTION
                WHEN NO_DATA_FOUND THEN
                    :P8_ROLE := NULL;
            END;
        
        END;
      items-to-submit: 
      - P8_SELECTED_USERNAME
      items-to-return: 
      - P8_FIRST_NAME
      - P8_LAST_NAME
      - P8_EMAIL
      - P8_MOBILE_NO
      - P8_DESCRIPTION
      - P8_IS_ACTIVE
      - P8_ROLE
      - P8_ACCOUNT_LOCKED
      - P8_IS_WORKSPACE_ADMIN
      suppress-change-event: false

    execution: 
      sequence: 10
      event: When the page loads and reloads # 39965121194997127
      fire-when-event-result-is: True
      fire-on-initialization: false
      stop-execution-on-error: true
      wait-for-result: true

