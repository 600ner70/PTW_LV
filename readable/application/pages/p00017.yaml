- # ====== Validation: Signature Required ======================
  id: 47750983222890031
  identification: 
    name: Signature Required

  execution: 
    sequence: 30

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      RETURN NOT (
          :P17_CANCEL_SIGNATURE_DATA IS NULL
          OR TRIM(:P17_CANCEL_SIGNATURE_DATA) IS NULL
          OR :P17_CANCEL_SIGNATURE_DATA = 'data:,'
      );
    always-execute: false

  error: 
    error-message: A signature is required to cancel this permit.
    display-location: Inline with Field and in Notification

  server-side-condition: 
    when-button-pressed: CANCEL_PERMIT # 47750408723890026

- # ====== Validation: Permit Still Valid for Cancellation =====
  id: 47751088513890032
  identification: 
    name: Permit Still Valid for Cancellation

  execution: 
    sequence: 40

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      DECLARE
          l_count NUMBER;
      BEGIN
          SELECT COUNT(*)
          INTO   l_count
          FROM   ptw_pro.ptw_lv_permits
          WHERE  permit_id       = :P17_PERMIT_ID
          AND    workflow_status NOT IN ('CANCELLED','COMPLETED','CLEARED');
          IF l_count > 0 THEN
            RETURN TRUE;
          ELSE
            RETURN FALSE;
          END IF;
      END;
    always-execute: false

  error: 
    error-message: This permit cannot be cancelled. It may already be cancelled or completed.
    display-location: Inline with Field and in Notification

  server-side-condition: 
    when-button-pressed: CANCEL_PERMIT # 47750408723890026

- # ====== Validation: Area Photo Required =====================
  id: 47752380362890045
  identification: 
    name: Area Photo Required

  execution: 
    sequence: 50

  validation: 
    type: Function Body (returning Boolean)
    language: PL/SQL
    pl/sql-function-body: |
      RETURN NOT (
          :P17_CANCEL_WORK_COMPLETE = 'N'
          AND (
              :P17_AREA_PHOTO_UPLOADED IS NULL
              OR :P17_AREA_PHOTO_UPLOADED != 'Y'
          )
      );
    always-execute: false

  error: 
    error-message: A photo of the area is required when works are not complete. Please take or upload a photo before signing off the cancellation.
    display-location: Inline with Field and in Notification

processes: 
- # ====== Process: Cancel Permit ==============================
  id: 47751164940890033
  identification: 
    name: Cancel Permit
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      DECLARE
          v_sig_blob BLOB;
      
          FUNCTION base64_to_blob(p_base64 CLOB) RETURN BLOB IS
              v_blob BLOB;
              v_clob CLOB;
          BEGIN
              IF p_base64 IS NULL THEN RETURN NULL; END IF;
              v_clob := REGEXP_REPLACE(p_base64, '^data:image/[^;]+;base64,', '');
              v_blob := apex_web_service.clobbase642blob(v_clob);
              RETURN v_blob;
          END base64_to_blob;
      
      BEGIN
          v_sig_blob := base64_to_blob(:P17_CANCEL_SIGNATURE_DATA);
      
          UPDATE ptw_pro.ptw_lv_permits
          SET    cancel_work_complete    = :P17_CANCEL_WORK_COMPLETE,
                 cancel_person_name     = UPPER(TRIM(:P17_CANCEL_PERSON_NAME)),
                 cancel_person_signature = v_sig_blob,
                 cancel_datetime        = SYSDATE,
                 cancel_latitude        = :P0_LATITUDE,
                 cancel_longitude       = :P0_LONGITUDE,
                 workflow_status        = 'CANCELLED',
                 current_step           = 'CANCELLED',
                 completion_date        = SYSDATE,
                 modified_by            = NVL(V('APP_USER'), USER),
                 modified_date          = CURRENT_TIMESTAMP
          WHERE  permit_id              = :P17_PERMIT_ID
          AND    workflow_status NOT IN ('CANCELLED','COMPLETED','CLEARED');
      
          IF SQL%ROWCOUNT = 0 THEN
              apex_error.add_error(
                  p_message          => 'Permit could not be cancelled. It may have already '
                                     || 'been cancelled or completed. Please refresh the '
                                     || 'permits list.',
                  p_display_location => apex_error.c_inline_in_notification
              );
              RETURN;
          END IF;
      
          :P17_CANCELLED := 'Y';
      
          COMMIT;
      
      EXCEPTION
          WHEN OTHERS THEN
              ROLLBACK;
              apex_error.add_error(
                  p_message          => 'Error cancelling permit: ' || SQLERRM,
                  p_display_location => apex_error.c_inline_in_notification
              );
              RAISE;
      END;
      

  execution: 
    sequence: 10
    point: Processing
    run-process: Once Per Page Visit (default)

  error: 
    display-location: Inline in Notification

  server-side-condition: 
    when-button-pressed: CANCEL_PERMIT # 47750408723890026

