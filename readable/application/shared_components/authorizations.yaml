---
- # ====== Authorization: Administration Rights ================
  id: 26419849891144614
  identification: 
    name: Administration Rights

  subscription: 
    version-number: 46647445791035

  authorization-scheme: 
    type: PL/SQL Function Returning Boolean

  settings: 
    pl/sql-function-body: |
      DECLARE
          v_count NUMBER;
      BEGIN
          SELECT COUNT(*)
          INTO   v_count
          FROM   ptw_pro.ptw_lv_user_roles_v
          WHERE  UPPER(username) = UPPER(:APP_USER)
          AND    role_name IN ('ADMIN', 'ADMIN_USER_SUPPORT')
          AND    is_active = 'Y';
          RETURN v_count > 0;
      EXCEPTION
          WHEN OTHERS THEN RETURN FALSE;
      END;

  server-cache: 
    evaluation-point: Once per Page View

  error: 
    error-message: Insufficient privileges - you must be an Administrator or User Support Admin to access this page.

