- # ====== Application Process: GET_SIGNATURES_P5 ==============
  id: 38142264028353790
  identification: 
    name: GET_SIGNATURES_P5
    type: NATIVE_PLSQL

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      DECLARE
          v_auth_blob   BLOB;
          v_accept_blob BLOB;
          v_auth_b64    CLOB;
          v_accept_b64  CLOB;
      BEGIN
          SELECT auth_person_signature,
                 accept_person_signature
          INTO   v_auth_blob,
                 v_accept_blob
          FROM   ptw_pro.ptw_lv_permits
          WHERE  permit_id = :P5_PERMIT_ID;
      
          IF v_auth_blob IS NOT NULL AND DBMS_LOB.GETLENGTH(v_auth_blob) > 0 THEN
              v_auth_b64 := apex_web_service.blob2clobbase64(v_auth_blob);
          END IF;
      
          IF v_accept_blob IS NOT NULL AND DBMS_LOB.GETLENGTH(v_accept_blob) > 0 THEN
              v_accept_b64 := apex_web_service.blob2clobbase64(v_accept_blob);
          END IF;
      
          apex_json.open_object;
          apex_json.write('authSig',   v_auth_b64);
          apex_json.write('acceptSig', v_accept_b64);
          apex_json.close_object;
      
      EXCEPTION
          WHEN NO_DATA_FOUND THEN
              apex_json.open_object;
              apex_json.write('authSig',   '');
              apex_json.write('acceptSig', '');
              apex_json.close_object;
      END;

  execution: 
    sequence: 1
    point: Ajax Callback

  security: 
    authorization-scheme: Must Not Be Public User

  subscription: 
    version-number: 46572808513163

- # ====== Application Process: GET_PHOTO ======================
  id: 40754350770548208
  identification: 
    name: GET_PHOTO
    type: NATIVE_PLSQL

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      DECLARE
          l_blob      BLOB;
          l_mime_type VARCHAR2(100);
          l_file_name VARCHAR2(255);
      BEGIN
          SELECT photo_data, mime_type, file_name
          INTO   l_blob, l_mime_type, l_file_name
          FROM   ptw_pro.ptw_lv_permit_photos
          WHERE  photo_id = TO_NUMBER(apex_application.g_x01);
      
          owa_util.mime_header(NVL(l_mime_type, 'image/jpeg'), FALSE);
          htp.p('Content-Length: ' || DBMS_LOB.GETLENGTH(l_blob));
          htp.p('Content-Disposition: inline; filename="' || NVL(l_file_name, 'photo.jpg') || '"');
          htp.p('Cache-Control: private, max-age=3600');
          owa_util.http_header_close;
          wpg_docload.download_file(l_blob);
          apex_application.stop_apex_engine;
      
      EXCEPTION
          WHEN apex_application.e_stop_apex_engine THEN RAISE;
          WHEN NO_DATA_FOUND THEN apex_application.stop_apex_engine;
          WHEN OTHERS THEN apex_application.stop_apex_engine;
      END;

  execution: 
    sequence: 1
    point: Before Header

  server-side-condition: 
    type: Request = Value
    value: APPLICATION_PROCESS=GET_PHOTO

  subscription: 
    version-number: 46727925656725

