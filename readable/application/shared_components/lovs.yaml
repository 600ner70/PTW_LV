- # ====== List of Values: PTW_AUTHORISED_PERSONS ==============
  id: 35799522908090663
  identification: 
    name: PTW_AUTHORISED_PERSONS

  subscription: 
    version-number: 47332139550510

  source: 
    location: Local Database
    type: SQL Query
    sql-query: |
      SELECT DISTINCT
          u.first_name || ' ' || u.last_name     AS display_value,
          u.username                             AS return_value,
          u.mobile_no
      FROM   ptw_pro.ptw_lv_user_roles_v  u
      WHERE  u.role_name IN ('ADMIN', 'AUTHORISER')
      AND    u.username <> 'PTW_PRO'
      AND    u.is_active = 'Y'
      AND    u.company_id = (
          SELECT company_id
          FROM   ptw_pro.ptw_lv_users
          WHERE  UPPER(username) = UPPER(:APP_USER)
      )
      ORDER BY display_value

  column-mapping: 
    return: RETURN_VALUE
    display: DISPLAY_VALUE
    default-sort: Use Order By from Query

